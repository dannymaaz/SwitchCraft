name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
          - platform: macos-latest
            target: macos
          - platform: windows-latest
            target: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Validate tag and version consistency
        run: npm run version:check
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}

      - name: Validate Rust formatting
        run: npm run fmt:check

      - name: Generate branded installer artwork
        run: npm run assets

      - name: Generate branded application icons
        run: npm run icons

      - name: Validate Rust core (locked)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests (locked)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and upload Tauri artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SwitchCraft ${{ github.ref_name }}'
          releaseBody: |
            Secure local session switching for supported AI developer tools.

            **Windows:** `.msi` / NSIS installer when generated
            **macOS:** `.dmg` disk image
            **Linux:** `.AppImage`, `.deb` and other generated packages

            SwitchCraft updater artifacts are cryptographically signed by the Tauri updater pipeline. Native Windows Authenticode and Apple Developer ID/notarization remain separate platform-signing work.
          releaseDraft: true
          prerelease: false

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish draft after all platform builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
