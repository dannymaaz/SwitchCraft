name: Package Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            build_args: ''
            bundle_dir: src-tauri/target/release/bundle
          - platform: macos-latest
            target: macos-universal
            build_args: '--target universal-apple-darwin'
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - platform: windows-latest
            target: windows
            build_args: ''
            bundle_dir: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_INCREMENTAL: 0
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata consistency
        run: npm run version:check

      - name: Validate locked Rust dependency graph
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate installer artwork
        run: npm run assets

      - name: Generate platform icons
        run: npm run icons

      - name: Build production bundles
        run: npx tauri build ${{ matrix.build_args }}

      - name: Verify bundle output (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          test -d "${{ matrix.bundle_dir }}"
          find "${{ matrix.bundle_dir }}" -type f -maxdepth 4 -print
          test -n "$(find "${{ matrix.bundle_dir }}" -type f -maxdepth 4 -print -quit)"

      - name: Verify bundle output (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bundleDir = '${{ matrix.bundle_dir }}'
          if (!(Test-Path $bundleDir)) { throw 'Bundle directory was not generated.' }
          $files = Get-ChildItem $bundleDir -Recurse -File
          $files | Select-Object FullName, Length
          if ($files.Count -eq 0) { throw 'No package artifacts were generated.' }

      - name: Upload package smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switchcraft-${{ matrix.target }}-package-smoke
          path: ${{ matrix.bundle_dir }}/**
          if-no-files-found: error
          retention-days: 7
