name: Fix release rustfmt

on:
  push:
    branches: [chore/v1.2-release-prep]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/v1.2-release-prep

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatted Rust sources
        shell: bash
        run: |
          if git diff --quiet -- src-tauri; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: format v1.2 migration cleanup"
          git push origin HEAD:chore/v1.2-release-prep
