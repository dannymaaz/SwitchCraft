name: Sync release lockfiles

on:
  push:
    branches: [chore/v1.2-release-prep]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/v1.2-release-prep

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize npm lock metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Synchronize Cargo lock metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null

      - name: Commit synchronized lockfiles
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock; then
            echo "Lockfiles are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "chore(release): synchronize v1.2 lockfiles"
          git push origin HEAD:chore/v1.2-release-prep
