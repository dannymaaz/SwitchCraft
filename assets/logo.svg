<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="30%" stop-color="#eac46a"/>
      <stop offset="70%" stop-color="#c99732"/>
      <stop offset="100%" stop-color="#966c14"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="100%" stop-color="#b3821a"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Top Arrow (Left to Right) with rounded fluid geometry -->
  <g filter="url(#subtleGlow)">
    <path d="M 120 185 L 340 185 C 365 185 385 165 385 140 C 385 115 365 95 340 95 L 320 95" 
          stroke="url(#goldGradient)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <path d="M 310 135 L 375 185 L 310 235" 
          stroke="url(#goldGradient)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Bottom Arrow (Right to Left) with rounded fluid geometry -->
  <g filter="url(#subtleGlow)">
    <path d="M 392 327 L 172 327 C 147 327 127 347 127 372 C 127 397 147 417 172 417 L 192 417" 
          stroke="url(#goldGradient)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
    
    <path d="M 202 277 L 137 327 L 202 377" 
          stroke="url(#goldGradient)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
  </g>

  <!-- Central Energy Core (Diamond Switch Axis) -->
  <rect x="236" y="236" width="40" height="40" rx="8" 
        transform="rotate(45 256 256)" 
        fill="url(#goldAccent)" />
</svg>
