<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d48a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4a853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6"/>
  <!-- Top arrow (pointing right) -->
  <g transform="translate(256, 200)">
    <path d="M-80,0 L50,0" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M30,-30 L60,0 L30,30" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Bottom arrow (pointing left) -->
  <g transform="translate(256, 312)">
    <path d="M80,0 L-50,0" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M-30,-30 L-60,0 L-30,30" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Center diamond accent -->
  <rect x="244" y="244" width="24" height="24" rx="4" transform="rotate(45 256 256)" fill="url(#goldGrad)"/>
</svg>
